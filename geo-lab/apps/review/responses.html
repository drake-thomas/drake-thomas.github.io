<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geo Lab Responses</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../../lib/ui.css">
<script src="../../config.js"></script>
<style>
  :root { --side: 400px; --feat: #ffd23f; --inc: #5ad17a; --exc: #ff6b6b; --lasso: #8fdcff;
    --accept: #5ad17a; --reject: #ff6b6b; --reply: #8fb8ff; }
  #mapWrap { position: fixed; top: 0; left: 0; bottom: 0; right: var(--side); }
  #map { width: 100%; height: 100%; }
  #side { position: fixed; top: 0; right: 0; bottom: 0; width: var(--side); z-index: 10; display: flex; flex-direction: column;
    background: var(--panel-solid); border-left: 1px solid var(--line); }
  #head { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
  #head select { padding: 4px 6px; font-size: 13px; min-width: 0; flex: 1; font: inherit; color: var(--text); background: #1b1f25;
    border: 1px solid #3a414c; border-radius: 8px; }
  #head label { font-size: 13px; display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
  #prog { font-variant-numeric: tabular-nums; }
  #body { flex: 1; overflow: auto; padding: 10px 12px; min-height: 0; display: grid; gap: 10px; align-content: start; }
  #title { font-size: 18px; margin: 0; line-height: 1.25; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; vertical-align: 2px; color: #111; white-space: nowrap; }
  .st-red { background: #ff8a7a; } .st-amber { background: #f0b84a; } .st-blue { background: #8fb8ff; } .st-grey { background: #b7bec7; }
  .v-accept { background: var(--accept); } .v-reject { background: var(--reject); } .v-reply { background: var(--reply); }
  #meta { margin-top: 2px; }
  .box { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #181c22; }
  .box h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
  .box p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .box .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  #descText { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  #descText.open { display: block; }
  #owner { border-color: #3c5a3f; }
  #resp { border-color: #5a4f2c; background: #1d1b15; }
  #mine { border-color: #34466a; }
  .keyl { display: inline-flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .keyl i { display: inline-block; width: 14px; height: 0; vertical-align: 3px; margin-right: 3px; }
  #foot { border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: grid; gap: 8px; }
  #verdicts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #verdicts button { padding: 11px 4px; font-size: 15px; font-weight: 700; border-width: 2px; }
  #verdicts button kbd { font-size: 11px; margin-left: 4px; opacity: .8; }
  #va { border-color: var(--accept); } #vr { border-color: var(--reject); } #vc { border-color: var(--reply); }
  #verdicts button.cur, #verdicts button.armed { color: #111; }
  #va.cur, #va.armed { background: var(--accept); } #vr.cur, #vr.armed { background: var(--reject); } #vc.cur, #vc.armed { background: var(--reply); }
  #verdicts button.armed { outline: 2px solid #fff; outline-offset: 1px; }
  #note { width: 100%; font: inherit; color: var(--text); background: #1b1f25; border: 1px solid #3a414c; border-radius: 8px; padding: 6px 8px; resize: vertical; }
  #nav button, #nav a { padding: 7px 10px; }
  #flash { min-height: 1.3em; }
  #flash.err { color: var(--warn); }
  #retry[hidden] { display: none; }
  #who input { font: inherit; color: var(--text); background: #1b1f25; border: 1px solid #3a414c; border-radius: 8px; padding: 4px 8px; min-width: 0; flex: 1; }
  #help { font-size: 12px; }
  #help kbd { font-size: 11px; }
  #status { position: fixed; top: 12px; left: 12px; z-index: 6; font-size: 13px; padding: 6px 10px; }
  #zbtns { position: fixed; top: 12px; right: calc(var(--side) + 12px); z-index: 6; display: flex; gap: 6px; }
  #zbtns button { padding: 6px 10px; font-size: 13px; }
  #zbtns button.on { background: #ffe27a; color: #1a1500; }
  @media (max-width: 760px) {
    :root { --side: 0px; }
    #mapWrap { right: 0; bottom: 55vh; }
    #side { top: auto; left: 0; height: 55vh; width: auto; border-left: none; border-top: 1px solid var(--line); }
    #zbtns { right: 10px; top: 10px; }
    #help { display: none; }
    #head, #body { padding: 6px 10px; }
    #title { font-size: 16px; }
    #verdicts button { padding: 13px 4px; }
    #verdicts button kbd { display: none; }
  }
</style>
</head>
<body class="fullbleed">
<div id="mapWrap"><div id="map"></div></div>
<div id="zbtns">
  <button id="viewBtn" title="Your original view (0)">Your view (0)</button>
  <button id="fitBtn" title="Fit the feature and your marks (F)">Fit (F)</button>
  <button id="labelsBtn" title="Toggle map labels (L)">Labels (L)</button>
  <button id="overlayBtn" title="Hide/show the outline and your marks, to judge prominence on the bare imagery (O, or hold H)">Overlay (O)</button>
</div>
<div id="status" class="panel muted">Loading…</div>

<aside id="side">
  <div id="head">
    <div class="row"><b class="grow">Coordinator responses</b><span id="prog" class="small muted"></span></div>
    <div class="row">
      <select id="jump" title="Jump to an entry"></select>
      <label title="Hide entries you've already accepted, rejected or replied to"><input id="fUnh" type="checkbox" checked> unhandled only</label>
    </div>
  </div>
  <div id="body">
    <div>
      <h2 id="title"></h2>
      <div id="meta" class="small muted"></div>
    </div>
    <div id="desc" class="box"><h3>Current description</h3><p id="descText" title="Click to expand / collapse"></p><div id="descSub" class="sub"></div></div>
    <div id="owner" class="box"><h3>Your feedback</h3><p id="ownerNote"></p><div id="ownerSub" class="sub"></div>
      <div class="keyl"><span><i style="border-top:3px solid var(--feat)"></i>current outline</span><span style="color:var(--inc)">✚ in</span><span style="color:var(--exc)">━ out</span><span><i style="border-top:2px dashed var(--lasso)"></i>your loop</span></div></div>
    <div id="resp" class="box"><h3>My response <span id="stTag" class="tag"></span></h3><p id="respText"></p><div id="respSub" class="sub"></div></div>
    <div id="mine" class="box" hidden><h3>Your verdict</h3><p id="mineText"></p></div>
  </div>
  <div id="foot">
    <div id="verdicts">
      <button id="va" data-v="accept" title="Accept: agree with the response (A)">Accept<kbd>A</kbd></button>
      <button id="vr" data-v="reject" title="Reject: you still think you're right; reopens it (R)">Reject<kbd>R</kbd></button>
      <button id="vc" data-v="reply" title="Reply with a comment (C)">Reply<kbd>C</kbd></button>
    </div>
    <textarea id="note" rows="2" placeholder="Reply / note (C to type; Enter sends; Shift+Enter newline; Shift+A / Shift+R add a note to accept / reject)"></textarea>
    <div id="nav" class="row">
      <button id="prev" title="Previous (←)">←</button><button id="next" title="Next (→)">→</button>
      <a id="explore" class="btn small" target="_blank" rel="noopener" title="Open the explorer at this view with the feature selected (E)">Show in explorer ↗</a>
      <span id="flash" class="small muted grow"></span>
      <button id="retry" class="linkish small" hidden></button>
    </div>
    <div id="who" class="row small"></div>
    <div id="help" class="muted"><kbd>A</kbd> accept <kbd>R</kbd> reject <kbd>C</kbd> reply (Enter sends) · <kbd>Shift</kbd>+<kbd>A</kbd>/<kbd>R</kbd> with a note ·
      <kbd>←</kbd><kbd>→</kbd> move · <kbd>E</kbd> explorer · <kbd>0</kbd> your view · <kbd>F</kbd> fit · <kbd>L</kbd> labels · <kbd>-</kbd><kbd>=</kbd> zoom</div>
  </div>
</aside>

<script type="module">
import { loadMaps, loadJSON } from '../../lib/maps.js';
import { FB_NAME, FB_OWNER, lsGet, lsSet, fbPost, fbQueue, fbSave } from '../../lib/feedback.js';

// Coordinator responses (data/review/responses.json, built by tools/review/make_responses.py from
// data/feedback/responses.jsonl). Verdicts go out as review items: queue 'responses', candidate_id = entry id.
const QUEUE = 'responses';
const VKEY = `geolab.review.${QUEUE}`, SKEY = `geolab.review.${QUEUE}.state`;
const KEYV = { a: 'accept', r: 'reject', c: 'reply' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const linky = s => esc(s).replace(/https?:\/\/[^\s)<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);

let map, gm, entries = [], byId = new Map(), list = [], pos = 0, shapes = [], armed = null;
const handled = (() => { try { return JSON.parse(localStorage.getItem(VKEY) || '{}'); } catch { return {}; } })();
const saveHandled = () => { try { localStorage.setItem(VKEY, JSON.stringify(handled)); } catch {} };
const st = Object.assign({ unh: true, id: null, labels: false },
  (() => { try { return JSON.parse(localStorage.getItem(SKEY) || '{}'); } catch { return {}; } })());
const saveState = () => { try { localStorage.setItem(SKEY, JSON.stringify(st)); } catch {} };

// status -> colour family
const stCls = s => /disagree|differs|reject/.test(s) ? 'st-red' : /partial|extended|pending|followed/.test(s) ? 'st-amber'
  : /uncertain|confidence|inferred|gap|nothing|naming|umbrella/.test(s) ? 'st-blue' : 'st-grey';

// ---------- list ----------
function rebuild(keepId) {
  list = entries.filter(e => !st.unh || !handled[e.id] || e.id === keepId);
  pos = keepId ? Math.max(0, list.findIndex(e => e.id === keepId)) : 0;
  renderJump();
}
function renderJump() {
  $('jump').innerHTML = list.map(e => {
    const h = handled[e.id];
    return `<option value="${esc(e.id)}">${h ? { accept: '✓', reject: '✗', reply: '💬' }[h.v] + ' ' : '• '}${esc(e.feature?.name || e.feature_name || e.feature_id || '(unlabelled)')} · ${esc(e.status)}</option>`;
  }).join('');
  if (list[pos]) $('jump').value = list[pos].id;
}
function progress() {
  const done = entries.filter(e => handled[e.id]).length;
  $('prog').textContent = list.length ? `${pos + 1} / ${list.length} · ${entries.length - done} unhandled of ${entries.length}` : `${done} / ${entries.length} handled`;
}

// ---------- drawing ----------
function clear() { shapes.forEach(s => s.setMap(null)); shapes = []; }
const ll = p => ({ lat: p[0], lng: p[1] });           // owner points are [lat, lng]
const gl = c => ({ lat: c[1], lng: c[0] });           // GeoJSON is [lng, lat]
function drawFeature(f) {
  if (!f) return;
  const g = f.geometry;
  if (!g) {  // point feature: a ring at its anchor
    shapes.push(new gm.Marker({ map, position: { lat: f.lat, lng: f.lng }, clickable: false, zIndex: 40,
      icon: { path: gm.SymbolPath.CIRCLE, scale: 9, strokeColor: '#ffd23f', strokeWeight: 3, fillOpacity: 0 } }));
    return;
  }
  const paths = g.type === 'LineString' ? [g.coordinates] : g.type === 'MultiLineString' ? g.coordinates
    : g.type === 'Polygon' ? g.coordinates : g.type === 'MultiPolygon' ? g.coordinates.flat() : [];
  for (const p of paths) {
    const path = p.map(gl);
    shapes.push(new gm.Polyline({ map, path, strokeColor: '#000', strokeOpacity: 0.55, strokeWeight: 5.5, zIndex: 30, clickable: false }));
    shapes.push(new gm.Polyline({ map, path, strokeColor: '#ffd23f', strokeOpacity: 1, strokeWeight: 2.6, zIndex: 31, clickable: false }));
  }
}
function mark(p, plus) {
  const path = plus ? 'M -5,0 5,0 M 0,-5 0,5' : 'M -5,0 5,0';
  for (const [col, w] of [['#000', 6], [plus ? '#5ad17a' : '#ff6b6b', 3]])
    shapes.push(new gm.Marker({ map, position: ll(p), clickable: false, zIndex: 60 + (col !== '#000'),
      icon: { path, strokeColor: col, strokeWeight: w, scale: 1.4 } }));
}
function drawOwner(o) {
  (o.include || []).forEach(p => mark(p, true));
  (o.exclude || []).forEach(p => mark(p, false));
  if (o.lasso?.length) {
    const path = [...o.lasso, o.lasso[0]].map(ll);
    shapes.push(new gm.Polyline({ map, path, strokeOpacity: 0, zIndex: 45, clickable: false,
      icons: [{ icon: { path: 'M 0,-1 0,1', strokeColor: '#8fdcff', strokeOpacity: 1, strokeWeight: 2.5, scale: 3 }, offset: '0', repeat: '12px' }] }));
  }
}

// ---------- camera ----------
function boundsOf(e) {
  const b = new gm.LatLngBounds(); let n = 0;
  const add = x => { b.extend(x); n++; };
  const f = e.feature, o = e.owner || {};
  if (f?.bbox) { add({ lat: f.bbox[1], lng: f.bbox[0] }); add({ lat: f.bbox[3], lng: f.bbox[2] }); }
  else if (f) add({ lat: f.lat, lng: f.lng });
  [...(o.include || []), ...(o.exclude || []), ...(o.lasso || [])].forEach(p => add(ll(p)));
  return n ? b : null;
}
function ownerView(e) {
  const v = e.owner?.view;
  if (v?.lat != null && v?.lng != null && v?.z != null) { map.setCenter({ lat: v.lat, lng: v.lng }); map.setZoom(v.z); return true; }
  return fitAll(e);
}
function fitAll(e) {
  const b = boundsOf(e); if (!b) return false;
  if (b.getNorthEast().equals(b.getSouthWest())) { map.setCenter(b.getCenter()); map.setZoom(Math.max(6, 11 - Math.log2(Math.max(e.feature?.extent_km || 20, 1) / 10))); }
  else map.fitBounds(b, innerWidth <= 760 ? 30 : 60);
  return true;
}
function explorerUrl(e) {
  const v = e.owner?.view, f = e.feature;
  const c = v?.lat != null ? v : map ? { lat: map.getCenter().lat(), lng: map.getCenter().lng(), z: map.getZoom() } : { lat: f?.lat || 0, lng: f?.lng || 0, z: 6 };
  const id = f?.id || e.feature_id;
  return `../explorer/#${(+c.lat).toFixed(4)},${(+c.lng).toFixed(4)},${(+c.z).toFixed(1)}z${f ? '/' + encodeURIComponent(id) : ''}`;
}

// ---------- rendering ----------
const fmtDate = s => s ? String(s).slice(0, 10) : '';
function show(i) {
  clear();
  if (!list.length) {
    $('title').textContent = 'All handled 🎉'; $('meta').textContent = 'Untick "unhandled only" to revisit.';
    for (const id of ['desc', 'owner', 'resp', 'mine']) $(id).hidden = true;
    $('explore').removeAttribute('href'); progress(); return;
  }
  for (const id of ['desc', 'owner', 'resp']) $(id).hidden = false;
  pos = (i + list.length) % list.length;
  const e = list[pos], f = e.feature, o = e.owner || {}, h = handled[e.id];
  st.id = e.id; saveState();
  history.replaceState(null, '', '#' + encodeURIComponent(e.id));
  $('jump').value = e.id;
  progress();
  const name = f?.name || e.feature_name || (e.feature_id ? e.feature_id : 'Unlabelled spot');
  $('title').innerHTML = `${esc(name)}${h ? ` <span class="tag v-${h.v}">${h.v}</span>` : ''}`;
  $('meta').innerHTML = f
    ? `${esc(f.category || '')} · vis_zoom <b>${f.vis_zoom ?? '–'}</b>${f.country ? ' · ' + esc(f.country) : ''}${f.extent_km ? ` · ~${Math.round(f.extent_km)} km` : ''} · <code>${esc(f.id)}</code>${f.aka?.length ? `<br>aka ${esc(f.aka.join(', '))}` : ''}`
    : e.feature_id ? `<code>${esc(e.feature_id)}</code> is not in the current build (dropped or renamed?)` : 'No feature attached (nothing labelled here).';
  $('desc').hidden = !f;
  $('descText').classList.remove('open');
  if (f) { $('descText').innerHTML = linky(f.description || '(no description)'); $('descSub').innerHTML = f.look_for ? `Look for: ${esc(f.look_for)}` : ''; }
  $('ownerNote').innerHTML = o.note ? linky(o.note) : '<span class="muted">(no note)</span>';
  const bits = [o.type, fmtDate(e.date) && `responded ${fmtDate(e.date)}`, e.inbox_id != null && `inbox #${e.inbox_id}`,
    o.include?.length && `${o.include.length} in`, o.exclude?.length && `${o.exclude.length} out`, o.lasso?.length && 'loop',
    o.view && `view z${o.view.z}`].filter(Boolean);
  $('ownerSub').textContent = bits.join(' · ');
  $('stTag').textContent = e.status || ''; $('stTag').className = `tag ${stCls(e.status || '')}`;
  $('respText').innerHTML = linky(e.response || '');
  $('respSub').textContent = e.id;
  $('mine').hidden = !h;
  if (h) $('mineText').innerHTML = `<span class="tag v-${h.v}">${h.v}</span> ${h.note ? esc(h.note) : '<span class="muted">(no note)</span>'} <span class="small muted">· ${esc(fmtDate(h.ts))}</span>`;
  $('note').value = ''; setArmed(null);
  for (const b of document.querySelectorAll('#verdicts button')) b.classList.toggle('cur', b.dataset.v === h?.v);
  $('explore').href = explorerUrl(e);
  drawFeature(f); drawOwner(o);
  if (!overlayOn) shapes.forEach(s => s.setMap(null));
  ownerView(e);
  $('body').scrollTop = 0;
}

// ---------- verdicts ----------
let flashT;
function flash(msg, err) { $('flash').textContent = msg; $('flash').classList.toggle('err', !!err); clearTimeout(flashT); flashT = setTimeout(() => { $('flash').textContent = ''; }, 4000); }
function setArmed(v) { armed = v; for (const b of document.querySelectorAll('#verdicts button')) b.classList.toggle('armed', b.dataset.v === v); }
function refreshRetry() { const n = fbQueue().filter(x => x.type === 'review').length; $('retry').hidden = !n; $('retry').textContent = `${n} unsent – retry`; }
async function flushQueue() {
  const q = fbQueue(); if (!q.some(x => x.type === 'review')) return;
  const left = []; for (const x of q) if (x.type !== 'review' || await fbPost(x) !== 'ok') left.push(x);
  fbSave(left); refreshRetry();
}
function nextTarget() {
  for (let k = 1; k < list.length; k++) { const e = list[(pos + k) % list.length]; if (!handled[e.id]) return e.id; }
  return null;
}
async function send(v) {
  const e = list[pos]; if (!e) return;
  const note = $('note').value.trim();
  if (v === 'reply' && !note) { setArmed('reply'); $('note').focus(); flash('Type your reply, then Enter'); return; }
  const name = e.feature?.name || e.feature_name || e.feature_id || 'unlabelled spot';
  const item = { type: 'review', queue: QUEUE, candidate_id: e.id, candidate_name: name, verdict: v, note, ts: new Date().toISOString(),
    feature_id: e.feature_id || undefined };
  handled[e.id] = { v, note, ts: item.ts }; saveHandled();
  $('note').blur(); setArmed(null);
  const nid = nextTarget();
  if (st.unh) { rebuild(nid); show(pos); } else { renderJump(); show(nid ? list.findIndex(x => x.id === nid) : pos + 1); }
  const res = await fbPost(item);
  if (res === 'ok') { flash(`✓ ${v}: ${name}`); flushQueue(); }
  else { const q = fbQueue(); q.push(item); fbSave(q); flash(res === 'limited' ? 'Rate limited; saved to retry later' : 'Offline? Saved to retry later', true); }
  refreshRetry();
}
for (const b of document.querySelectorAll('#verdicts button')) b.onclick = () => send(b.dataset.v);
$('retry').onclick = async () => { await flushQueue(); flash(fbQueue().some(x => x.type === 'review') ? 'Still unsent' : 'Sent ✓'); };
$('descText').onclick = e => { if (!e.target.closest('a')) $('descText').classList.toggle('open'); };
$('note').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(armed || 'reply'); }
  else if (e.key === 'Escape') { $('note').blur(); setArmed(null); }
});

// ---------- keys / controls ----------
// O toggles the outline + marks; holding H hides them only while held (judge prominence without distractors)
let overlayOn = true;
function setOverlay(on) { overlayOn = on; shapes.forEach(s => s.setMap(on ? map : null)); $('overlayBtn').classList.toggle('on', !on); }
function toggleLabels() { st.labels = !st.labels; saveState(); map.setMapTypeId(st.labels ? 'hybrid' : 'satellite'); $('labelsBtn').classList.toggle('on', st.labels); }
$('labelsBtn').onclick = toggleLabels;
$('overlayBtn').onclick = () => setOverlay(!overlayOn);
addEventListener('keyup', e => { if ((e.key === 'h' || e.key === 'H') && !overlayOn && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') setOverlay(true); });
$('viewBtn').onclick = () => list[pos] && ownerView(list[pos]);
$('fitBtn').onclick = () => list[pos] && fitAll(list[pos]);
$('prev').onclick = () => show(pos - 1);
$('next').onclick = () => show(pos + 1);
$('jump').onchange = () => { show(list.findIndex(e => e.id === $('jump').value)); $('jump').blur(); };
$('fUnh').checked = st.unh;
$('fUnh').onchange = () => { st.unh = $('fUnh').checked; saveState(); rebuild(list[pos]?.id); show(pos); $('fUnh').blur(); };
addEventListener('keydown', e => {
  if (e.target.closest?.('textarea, input, select')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (KEYV[k]) {
    e.preventDefault();
    if (k === 'c' || e.shiftKey) { setArmed(KEYV[k]); $('note').focus(); }
    else send(KEYV[k]);
  }
  else if (e.key === 'ArrowRight') { e.preventDefault(); show(pos + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); show(pos - 1); }
  else if (e.key === '/' || e.key === 'Enter') { e.preventDefault(); setArmed('reply'); $('note').focus(); }
  else if (k === 'e') { if ($('explore').href) window.open($('explore').href, '_blank', 'noopener'); }
  else if (k === 'l') toggleLabels();
  else if (k === 'o') setOverlay(!overlayOn);
  else if (k === 'h') { if (!e.repeat) setOverlay(false); }
  else if (k === '0') list[pos] && ownerView(list[pos]);
  else if (k === 'f') list[pos] && fitAll(list[pos]);
  else if (e.key === '-' || e.key === '_') map.setZoom(map.getZoom() - 1);
  else if (e.key === '=' || e.key === '+') map.setZoom(map.getZoom() + 1);
});

// ---------- who ----------
function renderWho() {
  const name = lsGet(FB_NAME), owner = !!lsGet(FB_OWNER);
  $('who').innerHTML = name && !renderWho.edit
    ? `<span class="muted grow">Sending as <b>${esc(name)}</b>${owner ? ' ✓' : ''}</span><button class="linkish small" id="whoEdit">change</button>`
    : `<input id="whoName" maxlength="60" placeholder="Your name (remembered here)" value="${esc(name)}">`;
  const inp = $('whoName');
  if (inp) inp.onchange = () => { const v = inp.value.trim(); if (v) { lsSet(FB_NAME, v); renderWho.edit = false; renderWho(); } };
  else $('whoEdit').onclick = () => { renderWho.edit = true; renderWho(); $('whoName').focus(); };
}

// ---------- boot ----------
async function main() {
  let d;
  [gm, d] = await Promise.all([loadMaps(), loadJSON('../../data/review/responses.json')]);
  entries = d.entries; entries.forEach(e => byId.set(e.id, e));
  map = new gm.Map($('map'), {
    center: { lat: 20, lng: 0 }, zoom: 3, mapTypeId: st.labels ? 'hybrid' : 'satellite', tilt: 0,
    disableDefaultUI: true, scaleControl: true, gestureHandling: 'greedy', clickableIcons: false,
    isFractionalZoomEnabled: true, backgroundColor: '#000',
    zoomControl: true, zoomControlOptions: { position: gm.ControlPosition.LEFT_CENTER },
  });
  $('labelsBtn').classList.toggle('on', st.labels);
  window.__responses = { map, list: () => list, pos: () => pos, handled, entries };
  $('status').remove();
  renderWho(); refreshRetry();
  const want = decodeURIComponent(location.hash.slice(1)) || st.id;
  rebuild(byId.has(want) ? want : null);
  show(pos);
  flushQueue();
}
main().catch(e => { $('status').textContent = 'Error: ' + e.message; console.error(e); });
</script>
