<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satellite Geoguessr</title>
<style>
  :root {
    --panel: rgba(18, 20, 24, 0.88);
    --text: #eef0f3;
    --muted: #9aa3ad;
    --accent: #4fb3ff;
    --good: #5ad17a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, sans-serif; overflow: hidden; }

  /* The satellite map lives in an oversized square that is rotated, so the
     viewport is always fully covered whatever the angle. */
  #viewport { position: fixed; inset: 0; overflow: hidden; }
  #rot { position: absolute; transition: transform 1.2s ease; }
  /* #sat is the visible map. #pre sits hidden underneath it and loads the
     next few zoom-out levels ahead of time, so their tiles are already cached
     when you zoom out (slow tile loads draw a rotated square grid that gives
     away the orientation). */
  .sat { position: absolute; inset: 0; }
  #sat { z-index: 1; }
  /* Between levels L-1 and L the visible map draws level-L tiles shrunk down,
     covering up to twice its width, so the prefetch map is twice as big. */
  #pre { z-index: 0; inset: -50%; }
  #warm { z-index: -1; }  /* preloads the next round's tiles, always covered */

  .panel { background: var(--panel); border-radius: 10px; padding: 10px 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,.4); backdrop-filter: blur(4px); }
  #hud { position: fixed; top: 12px; left: 12px; display: flex; gap: 18px; align-items: center; z-index: 5; }
  #hud .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  #hud .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }

  #zoom { position: fixed; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  button { font: inherit; color: var(--text); background: #2a2f37; border: 1px solid #3a414c;
    border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  button:hover:not(:disabled) { background: #343b45; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: #001a2c; border-color: transparent; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #74c3ff; }
  #zoom button { width: 44px; height: 44px; font-size: 22px; padding: 0; }

  #guessWrap { position: fixed; right: 12px; bottom: 12px; z-index: 6; display: flex; flex-direction: column;
    gap: 8px; align-items: stretch; width: 320px; transition: width .2s ease; }
  #guessWrap:hover, #guessWrap.pinned { width: min(640px, calc(100vw - 24px)); }
  #guessMap { height: 220px; border-radius: 10px; overflow: hidden; transition: height .2s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,.5); }
  #guessWrap:hover #guessMap, #guessWrap.pinned #guessMap { height: min(440px, calc(100vh - 140px)); }
  #guessRow { display: flex; gap: 8px; }
  #guessRow .primary { flex: 1; }

  /* Reveal mode: guess map takes over most of the screen. */
  body.reveal #guessWrap { width: min(900px, calc(100vw - 24px)); right: 50%; transform: translateX(50%); }
  body.reveal #guessMap { height: min(520px, calc(100vh - 230px)); }
  body.reveal #guessRow { display: none; }
  /* Explore mode: results shrink to a corner card so the area can be browsed. */
  body.reveal.explore #guessWrap { width: 320px; right: 12px; transform: none; }
  body.reveal.explore #guessMap { display: none; }
  #result .row { display: flex; gap: 8px; justify-content: center; }

  #result { display: none; text-align: center; }
  body.reveal #result { display: block; }
  #result .dist { font-size: 22px; font-weight: 700; }
  #result .pts { font-size: 15px; color: var(--muted); margin: 2px 0 8px; }
  #result .pts b { color: var(--good); font-size: 18px; }

  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.6); z-index: 20; }
  #overlay.hidden { display: none; }
  #overlay .panel { max-width: 460px; padding: 22px 26px; }
  #overlay h1 { margin: 0 0 8px; font-size: 24px; }
  #overlay p { color: var(--muted); margin: 6px 0; }
  #overlay table { width: 100%; border-collapse: collapse; margin: 10px 0; font-variant-numeric: tabular-nums; }
  #overlay td { padding: 3px 4px; border-bottom: 1px solid #2c323b; }
  #overlay td:last-child { text-align: right; }
  kbd { background: #2a2f37; border: 1px solid #3a414c; border-radius: 4px; padding: 0 5px; font-size: 12px; }
  #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 4; color: var(--muted); }
</style>
<script src="../../config.js"></script>
</head>
<body>
<div id="viewport"><div id="rot"><div class="sat" id="sat"></div><div class="sat" id="pre"></div><div class="sat" id="warm"></div></div></div>
<div id="status">Loading…</div>

<div id="hud" class="panel">
  <div><div class="k">Round</div><div class="v" id="hRound">–</div></div>
  <div><div class="k">Zoom</div><div class="v" id="hZoom">–</div></div>
  <div><div class="k">Multiplier</div><div class="v" id="hMult">–</div></div>
  <div><div class="k">Total</div><div class="v" id="hTotal">0</div></div>
</div>

<div id="zoom">
  <button id="zIn" title="Zoom in (=)">+</button>
  <button id="zOut" title="Zoom out (-)">−</button>
</div>

<div id="guessWrap">
  <div id="result" class="panel">
    <div class="dist" id="rDist"></div>
    <div class="pts" id="rPts"></div>
    <div class="row">
      <button id="exploreBtn" title="Hide results and look around (Esc)">Explore</button>
      <button class="primary" id="nextBtn">Next round</button>
    </div>
  </div>
  <div id="guessMap"></div>
  <div id="guessRow">
    <button id="pinBtn" title="Keep the guess map expanded">📌</button>
    <button class="primary" id="guessBtn" disabled>Place a pin to guess</button>
  </div>
</div>

<div id="overlay"><div class="panel" id="overlayBody"></div></div>

<script>
'use strict';

// ---------- Settings ----------
const ROUNDS = 5;
const MAX_START_ZOOM = 18;     // how close the round starts (capped by imagery)
const MIN_IMAGERY_ZOOM = 15;   // reject spots whose best imagery is coarser than this
const MIN_ZOOM = 2;
const LAT_MIN = -60, LAT_MAX = 84;  // excludes Antarctica
const BEST_KEY = 'satgeo.best';

// ---------- Land sampling (area-uniform) ----------
let landPolys = [];  // [{bbox:[w,s,e,n], rings:[[[lng,lat],...], ...]}]

async function loadLand() {
  const gj = await (await fetch('data/ne_50m_land.geojson')).json();
  for (const f of gj.features) {
    const g = f.geometry;
    const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
    for (const rings of polys) {
      let w = 180, s = 90, e = -180, n = -90;
      for (const [x, y] of rings[0]) {
        if (x < w) w = x; if (x > e) e = x; if (y < s) s = y; if (y > n) n = y;
      }
      if (n < LAT_MIN) continue;
      landPolys.push({ bbox: [w, s, e, n], rings });
    }
  }
}

function inRing(x, y, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function isLand(lng, lat) {
  for (const p of landPolys) {
    const [w, s, e, n] = p.bbox;
    if (lng < w || lng > e || lat < s || lat > n) continue;
    if (inRing(lng, lat, p.rings[0]) && !p.rings.slice(1).some(h => inRing(lng, lat, h))) return true;
  }
  return false;
}

function randomLandPoint() {
  const z0 = Math.sin(LAT_MIN * Math.PI / 180), z1 = Math.sin(LAT_MAX * Math.PI / 180);
  for (;;) {
    const lat = Math.asin(z0 + Math.random() * (z1 - z0)) * 180 / Math.PI;
    const lng = Math.random() * 360 - 180;
    if (isLand(lng, lat)) return { lat, lng };
  }
}

// ---------- Geometry / scoring ----------
function haversineKm(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// Distance score out of 5000, scaled down the further you zoomed out
// (×1 if you never zoomed out, ×0.25 if you went all the way to MIN_ZOOM).
const distScore = km => 5000 * Math.exp(-km / 1500);
function multiplier() {
  if (round.startZoom <= MIN_ZOOM) return 1;
  return 0.25 + 0.75 * (round.lowestZoom - MIN_ZOOM) / (round.startZoom - MIN_ZOOM);
}
const fmtKm = km => km < 1 ? `${Math.round(km * 1000)} m` : km < 100 ? `${km.toFixed(1)} km` : `${Math.round(km).toLocaleString()} km`;

// ---------- Maps ----------
let sat, pre, guessMap, maxZoomSvc, guessMarker, answerMarker, line;
let game, round;

function layoutRotor() {
  const W = innerWidth, H = innerHeight, D = Math.ceil(Math.hypot(W, H)) + 4;
  Object.assign(document.getElementById('rot').style, {
    width: D + 'px', height: D + 'px', left: (W - D) / 2 + 'px', top: (H - D) / 2 + 'px',
  });
  for (const m of [sat, pre]) if (m) google.maps.event.trigger(m, 'resize');
}

function setRotation(deg, animate) {
  const rot = document.getElementById('rot');
  rot.style.transition = animate ? '' : 'none';
  rot.style.transform = `rotate(${deg}deg)`;
}

function bestImageryZoom(latLng) {
  return new Promise(res => maxZoomSvc.getMaxZoomAtLatLng(latLng, r =>
    res(r.status === google.maps.MaxZoomStatus.OK ? r.zoom : 0)));
}

async function pickLocation() {
  let fallback = null;
  for (let i = 0; i < 12; i++) {
    const p = randomLandPoint();
    const z = await bestImageryZoom(p);
    if (z >= MIN_IMAGERY_ZOOM) return { ...p, maxZoom: z };
    if (!fallback || z > fallback.maxZoom) fallback = { ...p, maxZoom: z };
  }
  return fallback;  // nothing sharp nearby; take the best we saw
}

async function initMaps() {
  const satOpts = {
    center: { lat: 0, lng: 0 }, zoom: 3, mapTypeId: 'satellite', tilt: 0,
    disableDefaultUI: true, gestureHandling: 'none', keyboardShortcuts: false,
    clickableIcons: false, isFractionalZoomEnabled: true, backgroundColor: '#000',
  };
  sat = new google.maps.Map(document.getElementById('sat'), satOpts);
  pre = new google.maps.Map(document.getElementById('pre'), { ...satOpts, isFractionalZoomEnabled: false });
  pre.addListener('tilesloaded', prefetchDone);
  warm = new google.maps.Map(document.getElementById('warm'), { ...satOpts, isFractionalZoomEnabled: false });
  layoutRotor();
  addEventListener('resize', layoutRotor);

  guessMap = new google.maps.Map(document.getElementById('guessMap'), {
    center: { lat: 20, lng: 0 }, zoom: 1, mapTypeId: 'roadmap',
    disableDefaultUI: true, zoomControl: true, gestureHandling: 'greedy',
    clickableIcons: false, draggableCursor: 'crosshair',
  });
  maxZoomSvc = new google.maps.MaxZoomService();

  guessMap.addListener('click', e => {
    if (!round || round.done) return;
    if (!guessMarker) guessMarker = new google.maps.Marker({ map: guessMap });
    guessMarker.setPosition(e.latLng);
    guessMarker.setMap(guessMap);
    const b = document.getElementById('guessBtn');
    b.disabled = false; b.textContent = 'Guess';
  });
}

// ---------- Smooth zoom ----------
let zCur = 0, zTarget = 0, anim = 0;

function zoomTo(z) {
  zTarget = Math.max(MIN_ZOOM, Math.min(round.startZoom, z));
  if (!anim) anim = requestAnimationFrame(zoomFrame);
}

function zoomFrame() {
  const d = zTarget - zCur;
  zCur = Math.abs(d) < 0.003 ? zTarget : zCur + d * 0.18;
  sat.moveCamera({ zoom: zCur });
  round.lowestZoom = Math.min(round.lowestZoom, zCur);
  updateHud();
  schedulePrefetch();
  anim = zCur === zTarget ? 0 : requestAnimationFrame(zoomFrame);
}

function stopZoomAnim() { cancelAnimationFrame(anim); anim = 0; }

// ---------- Prefetch ----------
// The hidden map steps through the next LOOKAHEAD zoom-out levels, one at a
// time; each level's tiles land in the browser cache for the visible map.
const LOOKAHEAD = 3, PREFETCH_TIMEOUT_MS = 1500;  // tilesloaded is unreliable on the hidden map
let prefetched = new Set(), preQueue = [], preBusy = null, preTimer = 0;

function schedulePrefetch() {
  if (!round || round.done) return;
  const base = Math.ceil(zCur - 1e-6);  // tile level currently drawn
  preQueue = [];
  for (let k = 0; k <= LOOKAHEAD; k++) {
    const z = base - k;
    if (z >= MIN_ZOOM && !prefetched.has(z) && z !== preBusy) preQueue.push(z);
  }
  pumpPrefetch();
}

function pumpPrefetch() {
  if (preBusy !== null || !preQueue.length || !round || round.done) return;
  preBusy = preQueue.shift();
  clearTimeout(preTimer);
  preTimer = setTimeout(prefetchDone, PREFETCH_TIMEOUT_MS);
  if (pre.getZoom() === preBusy) prefetchDone();  // already there
  else pre.setZoom(preBusy);  // (moveCamera doesn't fire tilesloaded)
}

function prefetchDone() {
  clearTimeout(preTimer);
  if (preBusy === null) return;
  prefetched.add(preBusy);
  preBusy = null;
  pumpPrefetch();
}

// ---------- Game flow ----------
function newGame() {
  game = { round: 0, total: 0, history: [] };
  hideOverlay();
  nextRound();
}

// The next round's location is chosen (and its tiles loaded into the browser cache)
// while the player is still looking at the current reveal or the intro screen.
let warm, pendingLoc = null;
const startZoomFor = loc => Math.min(MAX_START_ZOOM, Math.max(MIN_ZOOM + 1, (loc.maxZoom || 14) - 1));
function prepareNext() {
  pendingLoc = pickLocation().then(loc => {
    warm.setOptions({ center: loc, zoom: startZoomFor(loc) });
    return loc;
  });
}

async function nextRound() {
  game.round++;
  document.body.classList.remove('reveal', 'explore');
  for (const m of [guessMarker, answerMarker, line]) if (m) m.setMap(null);
  const b = document.getElementById('guessBtn');
  b.disabled = true; b.textContent = 'Place a pin to guess';
  guessMap.setOptions({ center: { lat: 20, lng: 0 }, zoom: 1 });

  setStatus('Finding somewhere…');
  document.getElementById('viewport').style.visibility = 'hidden';
  stopZoomAnim();
  const loc = await (pendingLoc || pickLocation());
  pendingLoc = null;
  // One level below the sharpest imagery: at the very top level, coverage gaps
  // get filled with upscaled tiles whose square edges would leak the rotation.
  const startZoom = startZoomFor(loc);
  round = { loc, startZoom, lowestZoom: startZoom, done: false };
  zCur = zTarget = startZoom;

  prefetched = new Set(); preQueue = []; preBusy = null;
  google.maps.event.addListenerOnce(sat, 'tilesloaded', () => {
    setStatus('');
    document.getElementById('viewport').style.visibility = 'visible';
  });
  sat.setOptions({ center: loc, zoom: startZoom, mapTypeId: 'satellite', gestureHandling: 'none' });
  pre.setOptions({ center: loc });
  setRotation(Math.random() * 360, false);
  schedulePrefetch();
  updateHud();
}

function zoomBy(d) {
  if (!round) return;
  if (round.done) {  // exploring after the guess: unclamped, Google animates it
    sat.setZoom(Math.round(sat.getZoom()) + d);
    return;
  }
  zoomTo(Math.round(zTarget) + d);
}

function updateHud() {
  if (!round) return;
  document.getElementById('hRound').textContent = `${game.round} / ${ROUNDS}`;
  document.getElementById('hZoom').textContent = zCur.toFixed(1);
  document.getElementById('hMult').textContent = `×${multiplier().toFixed(2)}`;
  document.getElementById('hTotal').textContent = Math.round(game.total).toLocaleString();
  document.getElementById('zIn').disabled = !round.done && zTarget >= round.startZoom - 0.001;
  document.getElementById('zOut').disabled = !round.done && zTarget <= MIN_ZOOM + 0.001;
}

function makeGuess() {
  if (!round || round.done || !guessMarker || !guessMarker.getMap()) return;
  round.done = true;
  const g = guessMarker.getPosition().toJSON();
  const km = haversineKm(g, round.loc);
  const mult = multiplier();
  const pts = Math.round(distScore(km) * mult);
  game.total += pts;
  game.history.push({ km, pts, mult });

  answerMarker = new google.maps.Marker({
    map: guessMap, position: round.loc,
    icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: '#5ad17a', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 },
  });
  line = new google.maps.Polyline({
    map: guessMap, path: [g, round.loc], geodesic: true,
    strokeColor: '#ffcc33', strokeWeight: 2, strokeOpacity: 0.9,
  });
  document.body.classList.add('reveal');
  const bounds = new google.maps.LatLngBounds(); bounds.extend(g); bounds.extend(round.loc);
  setTimeout(() => {
    google.maps.event.trigger(guessMap, 'resize');
    if (km < 5) guessMap.setOptions({ center: round.loc, zoom: 12 });
    else guessMap.fitBounds(bounds, 60);
  }, 250);

  // Un-rotate the satellite view and show labels so you can see where you were.
  setRotation(0, true);
  stopZoomAnim();
  sat.setOptions({ mapTypeId: 'hybrid', gestureHandling: 'greedy' });

  document.getElementById('rDist').textContent = `${fmtKm(km)} away`;
  document.getElementById('rPts').innerHTML =
    `<b>${pts.toLocaleString()}</b> points &nbsp;(${Math.round(distScore(km)).toLocaleString()} × ${mult.toFixed(2)} zoom multiplier)`;
  document.getElementById('nextBtn').textContent = game.round >= ROUNDS ? 'See results' : 'Next round';
  prepareNext();  // the next round (or the next game's first round) loads while you look around
  updateHud();
}

function next() {
  if (!round || !round.done) return;
  if (game.round >= ROUNDS) showSummary(); else nextRound();
}

// ---------- Overlay ----------
function showOverlay(html) {
  document.getElementById('overlayBody').innerHTML = html;
  document.getElementById('overlay').classList.remove('hidden');
}
function hideOverlay() { document.getElementById('overlay').classList.add('hidden'); }
function setStatus(t) { const s = document.getElementById('status'); s.textContent = t; s.style.display = t ? '' : 'none'; }

function readBest() { try { return +localStorage.getItem(BEST_KEY) || 0; } catch { return 0; } }
function writeBest(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch {} }

function showIntro() {
  const best = readBest();
  showOverlay(`
    <h1>🛰️ Satellite Geoguessr</h1>
    <p>You're dropped somewhere on land, very zoomed in, at a random rotation. Zoom out as little as you can, then pin your guess on the map at the bottom right.</p>
    <p>Score = distance score (up to 5,000) × zoom multiplier (1.00 → 0.25 based on how far out you zoomed). ${ROUNDS} rounds.</p>
    <p><kbd>-</kbd>/<kbd>=</kbd> or scroll to zoom &nbsp;·&nbsp; <kbd>Space</kbd> guess / next &nbsp;·&nbsp; <kbd>Esc</kbd> explore after guessing</p>
    ${best ? `<p>Best game: <b>${best.toLocaleString()}</b> / ${(ROUNDS * 5000).toLocaleString()}</p>` : ''}
    <p style="margin-top:14px"><button class="primary" id="startBtn">Start</button></p>`);
  document.getElementById('startBtn').onclick = newGame;
}

function showSummary() {
  const total = Math.round(game.total), best = readBest();
  if (total > best) writeBest(total);
  const rows = game.history.map((h, i) =>
    `<tr><td>Round ${i + 1}</td><td>${fmtKm(h.km)}</td><td>×${h.mult.toFixed(2)}</td><td>${h.pts.toLocaleString()}</td></tr>`).join('');
  showOverlay(`
    <h1>${total.toLocaleString()} / ${(ROUNDS * 5000).toLocaleString()}</h1>
    ${total > best ? '<p>New best!</p>' : `<p>Best: ${best.toLocaleString()}</p>`}
    <table>${rows}</table>
    <button class="primary" id="againBtn">Play again</button>`);
  document.getElementById('againBtn').onclick = newGame;
}

// ---------- Input ----------
document.getElementById('zIn').onclick = () => zoomBy(1);
document.getElementById('zOut').onclick = () => zoomBy(-1);
document.getElementById('guessBtn').onclick = makeGuess;
document.getElementById('nextBtn').onclick = next;
document.getElementById('exploreBtn').onclick = toggleExplore;
function toggleExplore() {
  if (!round || !round.done) return;
  const on = document.body.classList.toggle('explore');
  document.getElementById('exploreBtn').textContent = on ? 'Show map' : 'Explore';
  if (!on) setTimeout(() => google.maps.event.trigger(guessMap, 'resize'), 50);
}
document.getElementById('pinBtn').onclick = () => document.getElementById('guessWrap').classList.toggle('pinned');

document.getElementById('viewport').addEventListener('wheel', e => {
  if (!round || round.done) return;  // after the guess Google handles scrolling
  e.preventDefault();
  // Trackpad pinch arrives as ctrl+wheel with small deltas; a mouse notch is ~100px.
  const px = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
  zoomTo(zTarget - px * (e.ctrlKey ? 0.02 : 0.006));
}, { passive: false });

addEventListener('keydown', e => {
  if (!document.getElementById('overlay').classList.contains('hidden')) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); document.querySelector('#overlay button')?.click(); }
    return;
  }
  if (e.key === '-' || e.key === '_') zoomBy(-1);
  else if (e.key === '=' || e.key === '+') zoomBy(1);
  else if (e.key === 'Escape') toggleExplore();
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); round?.done ? next() : makeGuess(); }
});

// ---------- Boot ----------
window.gm_authFailure = () => showOverlay('<h1>Maps API key rejected</h1><p>Check the key in config.js and that the Maps JavaScript API is enabled for it.</p>');

window.boot = async () => {
  try {
    await loadLand();
    await initMaps();
    setStatus('');
    showIntro();
    prepareNext();
  } catch (err) {
    console.error(err);
    showOverlay(`<h1>Failed to start</h1><p>${String(err)}</p><p>Run it via <code>./play.sh</code> (it needs a local web server).</p>`);
  }
};

if (!window.GMAPS_KEY) {
  showOverlay('<h1>No API key</h1><p>Create config.js with <code>window.GMAPS_KEY = \'…\';</code></p>');
} else {
  const s = document.createElement('script');
  s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(window.GMAPS_KEY)}&callback=boot&loading=async&v=weekly`;
  s.async = true;
  document.head.appendChild(s);
}
</script>
</body>
</html>
